<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YAY 💘</title>
  <style>
    :root{
      --bg1:#ff4d6d;
      --bg2:#ffe4ec;
      --card:#ffffffd6;
      --text:#141414;
      --shadow: 0 18px 70px rgba(0,0,0,.20);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1100px 700px at 20% 20%, #fff, transparent 55%),
                  radial-gradient(900px 600px at 80% 20%, #ffd1dc, transparent 58%),
                  radial-gradient(circle at top, var(--bg2), var(--bg1));
      display:flex; align-items:center; justify-content:center;
      padding:22px;
      position:relative;
    }

    /* glowing background sparkles */
    .sparkle{
      position:fixed;
      width:6px; height:6px;
      border-radius:999px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 0 18px rgba(255,255,255,.9);
      opacity:.9;
      animation: twinkle 1.8s infinite ease-in-out;
      pointer-events:none;
    }
    @keyframes twinkle{
      0%,100%{ transform: scale(.8); opacity:.6; }
      50%{ transform: scale(1.4); opacity:1; }
    }

    /* floating hearts */
    .heart{
      position:fixed;
      bottom:-40px;
      font-size:18px;
      opacity:.95;
      animation: floatUp linear forwards;
      pointer-events:none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      to{
        transform: translateY(-120vh) translateX(var(--drift)) rotate(25deg);
        opacity:1;
      }
    }

    .card{
      width:min(860px, 96vw);
      background:var(--card);
      border:1px solid #ffffff90;
      backdrop-filter: blur(10px);
      border-radius:32px;
      padding:36px 22px 28px;
      text-align:center;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* shiny sweep */
    .card::before{
      content:"";
      position:absolute;
      inset:-60px -140px auto auto;
      width:280px; height:280px;
      background: radial-gradient(circle, rgba(255,255,255,.85), transparent 60%);
      transform: rotate(25deg);
      opacity:.5;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:#ffffffde;
      border:1px solid #ffffff;
      font-weight:900;
      color:#111;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      margin-bottom:14px;
    }

    h1{
      margin: 0 0 10px;
      font-size: clamp(30px, 4.2vw, 56px);
      color:var(--text);
      letter-spacing:.2px;
      text-shadow: 0 10px 30px rgba(0,0,0,.08);
      animation: pop 900ms ease both;
    }
    @keyframes pop{
      from{ transform: translateY(10px) scale(.96); opacity:0; }
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    .big{
      margin: 10px auto 0;
      width:min(720px, 95%);
      font-size: clamp(16px, 2.4vw, 24px);
      font-weight:900;
      color:#1a1a1a;
      line-height:1.45;
    }
    .big b{ color:#000; }

    .sub{
      margin-top:12px;
      font-size: 14px;
      opacity:.8;
      font-weight:700;
    }

    /* fireworks canvas */
    canvas{
      position:fixed;
      inset:0;
      z-index:-1;
    }

    /* confetti pieces */
    .confetti{
      position:fixed;
      width:10px; height:14px;
      top:-20px;
      left:0;
      opacity:.95;
      transform: rotate(0deg);
      animation: fall 2.2s linear forwards;
      pointer-events:none;
    }
    @keyframes fall{
      to{ transform: translateY(110vh) rotate(880deg); opacity:1; }
    }

    /* button */
    .btn{
      margin-top:18px;
      display:inline-flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border-radius:18px;
      background:#111;
      color:#fff;
      font-weight:900;
      border:none;
      cursor:pointer;
      box-shadow: 0 14px 28px rgba(0,0,0,.15);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover{ filter: brightness(1.05); transform: translateY(-1px); }
    .btn:active{ transform: scale(.98); }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="card">
    <div class="badge">💖 YES CONFIRMED 💖</div>
    <h1>Congratulations!</h1>
    <div class="big">
      You are <b>Pranay’s</b> Valentine for his complete life 🥰💍
    </div>
    <div class="sub">P.S. Ab toh lifetime booking ho gayi 😌💘</div>

    <button class="btn" id="more">More celebration 🎉</button>
  </div>

  <script>
    // ===== CUSTOMIZE =====
    const YOUR_NAME = "Pranay";
    // =====================

    // sparkle background
    for(let i=0;i<28;i++){
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = (Math.random()*100) + "vw";
      s.style.top  = (Math.random()*100) + "vh";
      s.style.animationDelay = (Math.random()*1.8) + "s";
      s.style.opacity = (0.5 + Math.random()*0.5);
      document.body.appendChild(s);
    }

    // hearts rain
    let heartTimer = setInterval(()=>{
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() < .33 ? "💖" : (Math.random() < .5 ? "💘" : "💞");
      h.style.left = (Math.random()*100) + "vw";
      h.style.setProperty("--drift", (Math.random()*160 - 80) + "px");
      h.style.animationDuration = (3 + Math.random()*3.5) + "s";
      h.style.fontSize = (14 + Math.random()*22) + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 7500);
    }, 170);

    // confetti burst
    function confettiBurst(count){
      for(let i=0;i<count;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = (Math.random()*100) + "vw";
        c.style.background = `hsl(${Math.random()*360}, 90%, 60%)`;
        c.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
        c.style.width = (6 + Math.random()*10) + "px";
        c.style.height = (8 + Math.random()*16) + "px";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 3400);
      }
    }
    confettiBurst(220);

    // fireworks (simple particles)
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    let W,H;
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const bursts = [];
    function addBurst(x,y){
      const n = 70 + Math.floor(Math.random()*50);
      const hue = Math.random()*360;
      const parts = [];
      for(let i=0;i<n;i++){
        const a = (Math.PI*2)*(i/n);
        const sp = 2 + Math.random()*4.2;
        parts.push({
          x,y,
          vx: Math.cos(a)*sp*(0.7+Math.random()*0.6),
          vy: Math.sin(a)*sp*(0.7+Math.random()*0.6),
          life: 70 + Math.random()*35,
          hue
        });
      }
      bursts.push(parts);
    }

    // periodic fireworks
    let t = 0;
    function loop(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = "rgba(0,0,0,0.06)";
      // slight trail
      ctx.fillRect(0,0,W,H);

      for(let b=bursts.length-1;b>=0;b--){
        const parts = bursts[b];
        for(let i=parts.length-1;i>=0;i--){
          const p = parts[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.03; // gravity
          p.vx *= 0.992;
          p.vy *= 0.992;
          p.life -= 1;

          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${Math.max(0, p.life/90)})`;
          ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
          ctx.fill();

          if(p.life <= 0) parts.splice(i,1);
        }
        if(parts.length === 0) bursts.splice(b,1);
      }

      // auto bursts
      t++;
      if(t % 24 === 0){
        addBurst(Math.random()*W, (0.15+Math.random()*0.45)*H);
      }

      requestAnimationFrame(loop);
    }
    // start with a few bursts
    for(let i=0;i<4;i++) addBurst(Math.random()*W, (0.18+Math.random()*0.35)*H);
    loop();

    // button = extra celebration
    document.getElementById("more").addEventListener("click", ()=>{
      confettiBurst(260);
      for(let i=0;i<6;i++){
        addBurst(Math.random()*W, (0.18+Math.random()*0.45)*H);
      }
    });
  </script>
</body>
</html>
